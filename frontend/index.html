<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insightex</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 0 auto; padding: 16px; color: #222; }
  header { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid #ccc; margin-bottom: 16px; }
  header h1 { font-size: 1.3rem; margin: 0 0 8px; }
  header a { color: inherit; text-decoration: none; }
  section { margin-bottom: 28px; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; font-size: 1rem; }
  button { padding: 8px 14px; font-size: 1rem; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  .row { display: flex; gap: 8px; margin: 8px 0; align-items: center; flex-wrap: wrap; }
  .row input[type=text] { flex: 1; min-width: 140px; }
  .card { display: flex; gap: 12px; border: 1px solid #ccc; padding: 12px; margin: 12px 0; }
  .card img { width: 200px; max-width: 40%; height: auto; align-self: flex-start; background: #eee; }
  .card h2 { margin: 0 0 6px; font-size: 1.1rem; }
  .meta { color: #555; margin: 2px 0; }
  .error { color: #a00; margin: 8px 0; }
  .note { color: #555; }
  progress { width: 100%; height: 18px; }
  video { width: 100%; background: #000; }
  ul.library { list-style: none; padding: 0; }
  ul.library li { margin: 8px 0; }
  ul.library a { display: flex; gap: 12px; text-decoration: none; color: inherit; border: 1px solid #ccc; padding: 8px; }
  ul.library img { width: 120px; height: auto; background: #eee; }
  ul.library li { display: flex; gap: 8px; align-items: stretch; }
  ul.library li a { flex: 1; }
  ul.library li button.delete { align-self: center; }
  .stages { list-style: none; padding: 0; margin: 8px 0; }
  .stages li { display: grid; grid-template-columns: 7rem 8rem 1fr; gap: 8px; align-items: center; margin: 6px 0; }
  .stages .st-message { grid-column: 2 / -1; color: #555; font-size: 0.9rem; min-height: 1.1em; }
  .stages .st-error { grid-column: 2 / -1; color: #a00; font-size: 0.9rem; }
  .add-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  @media (max-width: 680px) { .add-grid { grid-template-columns: 1fr; } }
  .add-grid h3 { margin: 0 0 8px; font-size: 1rem; }
  .dropzone { border: 2px dashed #888; padding: 20px 12px; text-align: center; cursor: pointer; color: #444; margin: 8px 0; }
  .dropzone:hover, .dropzone.over { background: #eef3ff; border-color: #36c; }
  .dropzone:focus-visible { outline: 3px solid #36c; outline-offset: 2px; }
  .dropzone[aria-disabled=true] { cursor: not-allowed; opacity: 0.6; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .notice { background: #fff8e1; border: 1px solid #e0c060; padding: 6px 10px; margin: 6px 0; font-size: 0.9rem; }
  .note-ok { background: #eaf6ea; border: 1px solid #7bb27b; padding: 6px 10px; margin: 6px 0; }
  .badge { display: inline-block; margin-left: 6px; padding: 0 6px; font-size: 0.8rem; border: 1px solid #b07a00;
           background: #fff3cd; color: #5c4000; border-radius: 3px; cursor: help; }
  .badge:focus-visible { outline: 3px solid #36c; outline-offset: 2px; }
  .lang { margin: 2px 0; }
  .lang.missing { color: #555; font-style: italic; }
  select { padding: 6px; font-size: 1rem; max-width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1><a href="/">Insightex</a></h1>
  <a href="/">Library</a>
</header>

<!-- Home: add a lecture + library -->
<main id="home" hidden>
  <section id="add">
    <h2>Add a lecture</h2>
    <div class="add-grid">
    <div id="link-box">
      <h3>From a link</h3>
      <label for="url">Paste a YouTube, Google Drive or direct video link</label>
      <div class="row">
        <input type="text" id="url" placeholder="https://..." autocomplete="off">
        <button id="check">Check link</button>
      </div>
    </div>

    <div id="upload-box">
      <h3>Upload a file</h3>
      <input type="file" id="file" class="sr-only" tabindex="-1" aria-label="Choose a video file"
             accept="video/*,.mkv,.webm,.wmv,.flv,.ts,.mpg,.mov,.avi">
      <div id="dropzone" class="dropzone" role="button" tabindex="0" aria-describedby="dz-hint">
        <span id="dz-hint">Drop a video here, or press Enter to choose a file</span>
      </div>
      <div id="file-info" class="meta" aria-live="polite"></div>
      <label for="up-lang">Language spoken in the lecture</label>
      <div class="row"><select id="up-lang" required aria-required="true"></select></div>
      <label><input type="checkbox" id="up-rights"> I own this lecture or have permission to use it.</label>
      <div class="row">
        <button id="up-btn" disabled>Upload</button>
        <button id="up-cancel" hidden>Cancel upload</button>
      </div>
      <div id="up-progress" hidden>
        <progress id="up-bar" max="100" value="0" aria-label="Upload progress"></progress>
        <div id="up-status" class="meta"></div>
      </div>
      <div id="up-live" class="sr-only" role="status" aria-live="polite"></div>
      <div id="up-error" class="error" role="alert" aria-live="assertive" hidden></div>
    </div>
    </div>
    <div id="add-error" class="error" role="alert" hidden></div>

    <div id="preview" class="card" hidden>
      <img id="pv-thumb" alt="" hidden>
      <div>
        <h2 id="pv-title"></h2>
        <div class="meta" id="pv-uploader"></div>
        <div class="meta" id="pv-duration"></div>
        <div id="pv-exists" hidden>
          <p><strong>Already in your library</strong></p>
          <button id="pv-open">Open lecture</button>
        </div>
        <div id="pv-new">
          <label for="link-lang">Language spoken in the lecture</label>
          <div class="row"><select id="link-lang" required aria-required="true"></select></div>
          <label><input type="checkbox" id="rights"> I own this lecture or have permission to use it.</label>
          <div class="row"><button id="add-btn" disabled>Add lecture</button></div>
        </div>
      </div>
    </div>

    <div id="progress" hidden>
      <div id="pr-title" role="status" aria-live="polite"></div>
      <div id="pr-language" class="meta"></div>
      <ul id="pr-stages" class="stages"></ul>
      <div id="pr-error" class="error" role="alert" hidden></div>
      <div id="pr-warnings"></div>
      <div class="row">
        <button id="pr-cancel" hidden>Cancel</button>
        <button id="pr-retry" hidden>Retry</button>
        <button id="pr-open" hidden>Open in player</button>
        <button id="pr-dismiss" hidden>Add another</button>
      </div>
    </div>
  </section>

  <section>
    <h2>Library</h2>
    <div id="lib-empty" class="note" hidden>No lectures yet. Add one above.</div>
    <ul id="library" class="library"></ul>
  </section>
</main>

<!-- Player -->
<main id="player" hidden>
  <h2 id="pl-title"></h2>
  <div id="pl-existing" class="note-ok" role="status" hidden>This lecture is already in your library.</div>
  <div id="pl-warnings" aria-label="Notices about this video"></div>
  <div class="meta" id="pl-duration"></div>
  <div class="meta" id="pl-language"></div>
  <video id="video" controls preload="metadata"></video>
  <div class="row">
    <label for="jump">Jump to</label>
    <input type="text" id="jump" placeholder="mm:ss or h:mm:ss" size="12" style="flex:0 1 160px">
    <button id="jump-btn">Go</button>
    <span id="jump-error" class="error" role="alert"></span>
  </div>
  <div class="row" id="yt-row" hidden>
    <a id="yt-link" href="#" target="_blank" rel="noopener">Open on YouTube at this time</a>
  </div>
  <div id="pl-error" class="error" role="alert" hidden></div>
</main>

<script type="module">
import { parseTimestamp, formatTimestamp } from "./timestamp.js";
import { describeWarning } from "./warnings.js";
import { PLACEHOLDER, UNTESTED_BADGE, UNTESTED_TOOLTIP, languageDisplay, sortedGroups } from "./languages.js";

const $ = (id) => document.getElementById(id);
const show = (el, on = true) => { el.hidden = !on; };

async function api(path, options) {
  let res;
  try {
    res = await fetch(path, options);
  } catch {
    throw new Error("Couldn't reach the Insightex server. Is it running?");
  }
  let body = null;
  try { body = await res.json(); } catch { /* non-JSON body */ }
  if (!res.ok) {
    const err = new Error(describeError(body?.error?.code, body?.error?.message));
    err.code = body?.error?.code;
    throw err;
  }
  return body;
}

const postJson = (path, data) => api(path, {
  method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data),
});

// ---------------------------------------------------------------- error and warning messages
/** One message per error code the server can return (ingest/errors.py ErrorCode, plus the client's own). */
const ERROR_MESSAGES = {
  UNSUPPORTED_URL: "This link isn't supported. Paste a YouTube, Google Drive or direct video link.",
  PLAYLIST_NOT_SUPPORTED: "Playlists aren't supported. Open the single video you want and paste its link.",
  LIVE_NOT_SUPPORTED: "Live or upcoming streams can't be added. Try again once the recording is published.",
  PRIVATE_OR_LOGIN_REQUIRED: "This video is private or needs a sign-in. Only publicly viewable videos can be added.",
  AGE_RESTRICTED: "This video is age-restricted and can't be added.",
  GEO_BLOCKED: "This video isn't available in this region, so it can't be added.",
  DRIVE_NOT_SHARED: "This Google Drive file isn't shared. Set sharing to \"Anyone with the link\" and try again.",
  DRIVE_QUOTA_EXCEEDED: "Google Drive has limited downloads of this file for now. Try later, or upload the file instead.",
  TOO_LONG: "This video is too long (the limit is 3 hours).",
  TOO_LARGE: "This file is too large to upload.",
  NOT_A_VIDEO: "This doesn't look like a video file we can read. Try an MP4, MKV, WebM or MOV file.",
  NO_AUDIO_STREAM: "This video has no sound track, so it can't be transcribed.",
  BLOCKED_ADDRESS: "This link points to a private or local network address and can't be used.",
  RIGHTS_NOT_CONFIRMED: "Please confirm you have the right to use this video first.",
  NETWORK_ERROR: "We couldn't reach the video's server. Check the link and try again.",
  DOWNLOAD_FAILED: "The video couldn't be downloaded. Please try again later.",
  TRANSCODE_FAILED: "The video couldn't be processed. The file may be damaged.",
  NO_VIDEO_STREAM: "This file has no picture, only sound. Upload a video file.",
  EMPTY_FILE: "This file is empty.",
  INSUFFICIENT_DISK: "There isn't enough free disk space to process this video.",
  UNSUPPORTED_CODEC: "This video uses a format we can't read. Convert it to MP4 (H.264) and try again.",
  DURATION_UNKNOWN: "We couldn't tell how long this video is, so it can't be added.",
  TOO_SHORT: "This video is too short (it must be at least 10 seconds).",
  TRUNCATED: "This video looks cut off or damaged: the processed copy is much shorter than the original.",
  SYNC_CHECK_FAILED: "We couldn't line up the sound with the picture in this video, so it can't be added.",
  LENGTH_REQUIRED: "The upload didn't say how large the file is. Please try again.",
  UPLOAD_BUSY: "Another upload is already in progress. Try again when it has finished.",
  UPLOAD_INTERRUPTED: "The upload was interrupted. Please try again.",
  MISSING_LANGUAGE: "Choose the language spoken in the lecture, then add it again.",
  UNKNOWN_LANGUAGE: "That lecture language isn't in the list. Choose one of the listed languages and add it again.",
  INSUFFICIENT_VRAM: "The graphics card doesn't have enough free memory to transcribe right now. Close other programs that use it, then retry.",
  GPU_NOT_AVAILABLE: "The graphics card couldn't be checked, so the lecture can't be transcribed. Check the NVIDIA driver, then retry.",
  MODEL_LOAD_FAILED: "The speech recognition model couldn't be loaded. Check the model cache, then retry.",
  GPU_OUT_OF_MEMORY: "The graphics card ran out of memory while transcribing. Close other programs that use it, then retry.",
  TRANSCRIBE_CRASHED: "Transcription stopped unexpectedly. Retry; if it fails again, check the worker log.",
  TRANSCRIBE_TIMEOUT: "Transcription took too long and was stopped. Retry when the computer is less busy.",
  EMPTY_TRANSCRIPT: "No speech was recognised in this lecture. Check that it has audible speech and that the right language was chosen.",
  // raised by this page
  CLIENT_NETWORK: "Couldn't reach the Insightex server. Is it running?",
  CLIENT_CANCELLED: "Upload cancelled.",
};
const GENERIC_ERROR = "Something went wrong. Please try again.";
/** Codes whose server message carries specifics (free vs needed memory, the unknown id): shown as sent. */
const SERVER_DETAIL_CODES = new Set(["INSUFFICIENT_VRAM", "UNKNOWN_LANGUAGE"]);
const describeError = (code, serverMessage) =>
  (SERVER_DETAIL_CODES.has(code) && serverMessage) ? serverMessage
    : ERROR_MESSAGES[code] ?? `${serverMessage || GENERIC_ERROR}${code ? ` (${code})` : ""}`;

/** The error code inside a stage error line such as "IngestRejected: NO_VIDEO_STREAM: ...", else null. */
const codeInStageError = (line) => /^(?:IngestRejected|IngestError|AsrError): ([A-Z_]+):/.exec(line)?.[1] ?? null;
/** The user-facing message after the code in such a line. */
const messageInStageError = (line) => /^(?:IngestRejected|IngestError|AsrError): [A-Z_]+: (.*)$/.exec(line)?.[1] ?? line;

// ---------------------------------------------------------------- lecture language (ADR-0040)
/** A language line: the label plus, for an untested language, a focusable badge with the tooltip. */
function languageLine(language, prefix = "Language: ") {
  const d = languageDisplay(language);
  const line = document.createElement("div");
  line.className = d.missing ? "lang missing" : "lang";
  line.textContent = d.missing ? d.text : `${prefix}${d.text}`;
  if (d.badge) {
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = UNTESTED_BADGE;
    badge.title = UNTESTED_TOOLTIP;
    badge.tabIndex = 0;
    badge.setAttribute("aria-label", `${UNTESTED_BADGE}: ${UNTESTED_TOOLTIP}`);
    line.append(badge);
  }
  return line;
}

/** Fill a language <select>: a disabled placeholder chosen by default, then one optgroup per tier. */
function fillLanguageSelect(select, groups) {
  const placeholder = new Option(PLACEHOLDER, "", true, true);
  placeholder.disabled = true;
  select.replaceChildren(placeholder);
  for (const g of sortedGroups(groups)) {
    const og = document.createElement("optgroup");
    og.label = g.label;
    for (const lang of g.languages) og.append(new Option(lang.label, lang.id));
    select.append(og);
  }
}

let languagesLoaded = null;
function loadLanguages() {
  languagesLoaded ??= api("/api/languages").then((body) => {
    for (const id of ["link-lang", "up-lang"]) fillLanguageSelect($(id), body.groups);
  }).catch((e) => {
    for (const id of ["link-lang", "up-lang"]) {
      const opt = new Option(`Languages unavailable: ${e.message}`, "", true, true);
      opt.disabled = true;
      $(id).replaceChildren(opt);
    }
  });
  return languagesLoaded;
}

// ---------------------------------------------------------------- routing
const params = new URLSearchParams(location.search);
const lectureId = params.get("lecture");
if (lectureId) initPlayer(lectureId); else initHome();

const playerUrl = (id) => `/?lecture=${encodeURIComponent(id)}`;

// ---------------------------------------------------------------- home: library
async function loadLibrary() {
  const list = $("library");
  list.replaceChildren();
  let lectures = [];
  try { lectures = (await api("/api/lectures")).lectures; } catch (e) { $("lib-empty").textContent = e.message; }
  show($("lib-empty"), lectures.length === 0);
  for (const lec of lectures) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = playerUrl(lec.lecture_id);
    if (lec.thumbnail_url) {
      const img = document.createElement("img");
      img.src = lec.thumbnail_url; img.alt = "";
      a.append(img);
    }
    const text = document.createElement("div");
    const title = document.createElement("strong");
    title.textContent = lec.title || lec.lecture_id;
    const dur = document.createElement("div");
    dur.className = "meta";
    dur.textContent = formatTimestamp(lec.duration_s) ?? "";
    text.append(title, dur, languageLine(lec.language));
    a.append(text);
    const del = document.createElement("button");
    del.className = "delete";
    del.textContent = "Delete";
    del.addEventListener("click", () => deleteLecture(lec));
    li.append(a, del);
    list.append(li);
  }
}

async function deleteLecture(lec) {
  const name = lec.title || lec.lecture_id;
  if (!confirm(`Delete "${name}"?\n\nThe processed lecture (video, audio and everything derived from it) is removed from this machine. To use it again you would have to add the link again.`)) return;
  try {
    await api(`/api/lectures/${encodeURIComponent(lec.lecture_id)}`, { method: "DELETE" });
  } catch (e) {
    alert(e.message);
  }
  loadLibrary();
}

// ---------------------------------------------------------------- home: ingest flow
let eventSource = null;
let pollTimer = null;
let currentJob = null;

function showAddError(message) {
  $("add-error").textContent = message;
  show($("add-error"), Boolean(message));
}

function stopWatching() {
  if (eventSource) { eventSource.close(); eventSource = null; }
  clearTimeout(pollTimer);
}

function resetAdd() {
  stopWatching();
  currentJob = null;
  showAddError("");
  show($("preview"), false);
  show($("progress"), false);
  $("check").disabled = false;
  $("url").disabled = false;
  resetUpload();
}

function initHome() {
  show($("home"));
  loadLibrary();
  loadLanguages();
  initUpload();
  let probed = null;
  const updateAddButton = () => { $("add-btn").disabled = !($("rights").checked && $("link-lang").value); };

  $("check").addEventListener("click", async () => {
    const url = $("url").value.trim();
    resetAdd();
    if (!url) { showAddError("Paste a link first."); return; }
    $("check").disabled = true;
    try {
      probed = await postJson("/api/ingest/probe", { url });
    } catch (e) {
      showAddError(e.message);
      return;
    } finally {
      $("check").disabled = false;
    }
    renderPreview(probed);
  });

  $("url").addEventListener("keydown", (e) => { if (e.key === "Enter") $("check").click(); });
  $("rights").addEventListener("change", updateAddButton);
  $("link-lang").addEventListener("change", updateAddButton);
  $("pv-open").addEventListener("click", () => { location.href = playerUrl(probed.workspace_id); });

  $("add-btn").addEventListener("click", async () => {
    const language = $("link-lang").value;
    if (!$("rights").checked || !language) return;
    $("add-btn").disabled = true;
    try {
      const accepted = await postJson("/api/ingest/link",
        { url: $("url").value.trim(), rights_confirmed: true, language });
      watchJob(accepted.job_id);
    } catch (e) {
      showAddError(e.message);
      updateAddButton();
    }
  });

  $("pr-cancel").addEventListener("click", async () => {
    $("pr-cancel").disabled = true;
    try { await postJson(`/api/jobs/${encodeURIComponent(currentJob.id)}/cancel`, {}); } catch (e) { showAddError(e.message); }
  });
  $("pr-retry").addEventListener("click", async () => {
    try {
      await postJson(`/api/jobs/${encodeURIComponent(currentJob.id)}/retry`, {});
      watchJob(currentJob.id);
    } catch (e) { showAddError(e.message); }
  });
  $("pr-open").addEventListener("click", () => { location.href = playerUrl(currentJob.workspace_id); });
  $("pr-dismiss").addEventListener("click", resetAdd);
}

function renderPreview(p) {
  const thumb = $("pv-thumb");
  if (p.thumbnail_url) { thumb.src = p.thumbnail_url; show(thumb); } else { thumb.removeAttribute("src"); show(thumb, false); }
  $("pv-title").textContent = p.title || "(untitled)";
  $("pv-uploader").textContent = p.uploader ? `By ${p.uploader}` : "";
  const dur = formatTimestamp(p.duration_s);
  $("pv-duration").textContent = dur ?? "Duration checked after download";
  show($("pv-exists"), p.exists_locally);
  show($("pv-new"), !p.exists_locally);
  $("rights").checked = false;
  $("link-lang").selectedIndex = 0;  // the placeholder: no language is preselected
  $("add-btn").disabled = true;
  show($("preview"));
}

const STAGE_LABELS = { fetch: "Download", normalise: "Convert video and audio", asr: "Transcribe" };
const STATUS_LABELS = {
  pending: "Waiting", running: "Working", succeeded: "Done", cached: "Done (reused)", failed: "Failed", cancelled: "Cancelled",
};
const isTerminal = (status) => ["succeeded", "failed", "cancelled"].includes(status);

/** Draw the job document: one row per stage (name, status, progress bar, message) and the action buttons. */
function renderJob(job) {
  currentJob = job;
  show($("preview"), false);
  show($("progress"));
  $("check").disabled = true;
  $("url").disabled = true;
  setUploadEnabled(false);
  $("pr-title").textContent = job.status === "queued" ? "Waiting for the worker" : "";
  $("pr-language").replaceChildren(...(job.language ? [languageLine(job.language)] : []));
  $("pr-warnings").replaceChildren(...(job.warnings ?? []).map((w) => {
    const note = document.createElement("div");
    note.className = "notice";
    note.setAttribute("role", "note");
    note.textContent = describeWarning(w);
    return note;
  }));
  const list = $("pr-stages");
  list.replaceChildren();
  let failure = null;
  for (const st of job.stages) {
    const li = document.createElement("li");
    const name = document.createElement("span");
    name.textContent = (job.kind === "ingest_file" && st.name === "fetch") ? "Receive file" : (STAGE_LABELS[st.name] ?? st.name);
    const status = document.createElement("span");
    status.textContent = STATUS_LABELS[st.status] ?? st.status;
    const bar = document.createElement("progress");
    bar.max = 100;
    bar.value = Math.round(st.progress * 100);
    li.append(name, status, bar);
    const msg = document.createElement("div");
    msg.className = "st-message";
    msg.textContent = st.status === "running" ? (st.message ?? "") : "";
    li.append(msg);
    if (st.status === "failed" && st.error) {
      const first = st.error.split("\n")[0];  // first line only; the traceback stays in the worker log
      const code = codeInStageError(first);
      failure = code ? describeError(code, messageInStageError(first)) : first;
      const err = document.createElement("div");
      err.className = "st-error";
      err.textContent = failure;
      li.append(err);
    }
    list.append(li);
  }
  const active = job.status === "queued" || job.status === "running";
  show($("pr-cancel"), active);
  $("pr-cancel").disabled = false;
  show($("pr-retry"), job.status === "failed" || job.status === "cancelled");
  show($("pr-open"), job.status === "succeeded");
  show($("pr-dismiss"), isTerminal(job.status));
  const errorBox = $("pr-error");
  errorBox.textContent = job.status === "failed" ? (failure ?? job.error ?? "The lecture couldn't be added.")
    : job.status === "cancelled" ? "Cancelled." : "";
  show(errorBox, errorBox.textContent !== "");
  if (job.status === "succeeded") {
    $("pr-title").textContent = "Ready";
    loadLibrary();
  }
}

/** Follow a job: Server-Sent Events first; if the stream errors, poll the job every 2 s until it ends. */
function watchJob(jobId) {
  stopWatching();
  showAddError("");
  const id = encodeURIComponent(jobId);
  const poll = async () => {
    try {
      const job = await api(`/api/jobs/${id}`);
      renderJob(job);
      if (!isTerminal(job.status)) pollTimer = setTimeout(poll, 2000);
    } catch (e) {
      showAddError(e.message);
      pollTimer = setTimeout(poll, 2000);
    }
  };
  if (typeof EventSource === "undefined") { poll(); return; }
  const es = new EventSource(`/api/jobs/${id}/events`);
  eventSource = es;
  es.addEventListener("status", (ev) => {
    const job = JSON.parse(ev.data);
    renderJob(job);
    if (isTerminal(job.status)) stopWatching();
  });
  es.onerror = () => {
    // The server closes the stream after the final event, which also fires onerror; only fall back if still going.
    es.close();
    if (eventSource === es) { eventSource = null; if (!currentJob || !isTerminal(currentJob.status)) poll(); }
  };
}

// ---------------------------------------------------------------- home: upload a file
let maxUploadBytes = null;
let chosenFile = null;
let activeXhr = null;

const formatBytes = (n) => n >= 1024 ** 3 ? `${(n / 1024 ** 3).toFixed(2)} GB`
  : n >= 1024 ** 2 ? `${(n / 1024 ** 2).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`;

const warnBeforeUnload = (e) => { e.preventDefault(); e.returnValue = ""; };

function showUploadError(message) {
  $("up-error").textContent = message;
  show($("up-error"), Boolean(message));
}

function updateUploadButton() {
  $("up-btn").disabled = !(chosenFile && $("up-rights").checked && $("up-lang").value && !activeXhr);
}

function setUploadEnabled(on) {
  $("dropzone").setAttribute("aria-disabled", String(!on));
  $("file").disabled = !on;
  $("up-rights").disabled = !on;
  $("up-lang").disabled = !on;
  if (!on) $("up-btn").disabled = true; else updateUploadButton();
}

function resetUpload() {
  if (activeXhr) return;
  chosenFile = null;
  $("file").value = "";
  $("file-info").textContent = "";
  $("up-rights").checked = false;
  $("up-lang").selectedIndex = 0;  // back to the placeholder
  show($("up-progress"), false);
  show($("up-cancel"), false);
  showUploadError("");
  setUploadEnabled(true);
}

function chooseFile(file) {
  showUploadError("");
  chosenFile = null;
  $("file-info").textContent = "";
  if (!file) { updateUploadButton(); return; }
  if (file.size === 0) showUploadError(describeError("EMPTY_FILE"));
  else if (maxUploadBytes !== null && file.size > maxUploadBytes) {
    showUploadError(`${describeError("TOO_LARGE")} (${formatBytes(file.size)}; the limit is ${formatBytes(maxUploadBytes)}.)`);
  } else {
    chosenFile = file;
    $("file-info").textContent = `${file.name} (${formatBytes(file.size)})`;
  }
  updateUploadButton();
}

function startUpload() {
  const file = chosenFile;
  const language = $("up-lang").value;
  if (!file || !$("up-rights").checked || !language || activeXhr) return;
  showUploadError("");
  showAddError("");
  const xhr = new XMLHttpRequest();
  activeXhr = xhr;
  xhr.open("POST", "/api/ingest/upload");
  xhr.setRequestHeader("Content-Type", "application/octet-stream");
  xhr.setRequestHeader("X-Insightex-Filename", encodeURIComponent(file.name.slice(0, 200)));
  xhr.setRequestHeader("X-Insightex-Rights-Confirmed", "true");  // the browser adds Content-Length for a File
  xhr.setRequestHeader("X-Insightex-Language", encodeURIComponent(language));
  setUploadEnabled(false);
  show($("up-cancel"), true);
  show($("up-progress"), true);
  $("up-bar").value = 0;
  $("up-status").textContent = "Starting...";
  window.addEventListener("beforeunload", warnBeforeUnload);

  const samples = [];  // {t, loaded} over the last few seconds, for the speed readout
  let lastAnnounced = -1;
  xhr.upload.onprogress = (ev) => {
    if (!ev.lengthComputable) return;
    const now = performance.now();
    samples.push({ t: now, loaded: ev.loaded });
    while (samples.length > 2 && now - samples[0].t > 3000) samples.shift();
    const first = samples[0];
    const speed = now > first.t ? (ev.loaded - first.loaded) / ((now - first.t) / 1000) : 0;
    const pct = Math.floor((ev.loaded / ev.total) * 100);
    $("up-bar").value = pct;
    $("up-status").textContent = `${pct}% (${formatBytes(ev.loaded)} of ${formatBytes(ev.total)})` +
      (speed > 0 ? ` at ${(speed / 1024 ** 2).toFixed(1)} MB/s` : "");
    if (pct - lastAnnounced >= 10) { lastAnnounced = pct; $("up-live").textContent = `Upload ${pct} percent`; }
  };

  const finish = () => {
    activeXhr = null;
    window.removeEventListener("beforeunload", warnBeforeUnload);
    show($("up-cancel"), false);
    setUploadEnabled(true);
  };
  xhr.onerror = () => { finish(); show($("up-progress"), false); showUploadError(describeError("CLIENT_NETWORK")); };
  xhr.onabort = () => { finish(); show($("up-progress"), false); showUploadError(describeError("CLIENT_CANCELLED")); };
  xhr.onload = () => {
    finish();
    let body = null;
    try { body = JSON.parse(xhr.responseText); } catch { /* not JSON */ }
    if (xhr.status === 202 && body?.job_id) {
      show($("up-progress"), false);
      watchJob(body.job_id);
    } else if (xhr.status === 200 && body?.deduplicated) {
      location.href = `${playerUrl(body.lecture_id)}&existing=1`;
    } else {
      show($("up-progress"), false);
      showUploadError(describeError(body?.error?.code, body?.error?.message));
    }
  };
  xhr.send(file);
}

async function initUpload() {
  try { maxUploadBytes = (await api("/api/ingest/limits")).max_upload_bytes; } catch { /* the server still checks */ }
  const zone = $("dropzone"), input = $("file");
  const enabled = () => zone.getAttribute("aria-disabled") !== "true";
  zone.addEventListener("click", () => { if (enabled()) input.click(); });
  zone.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && enabled()) { e.preventDefault(); input.click(); }
  });
  input.addEventListener("change", () => chooseFile(input.files[0] ?? null));
  for (const type of ["dragenter", "dragover"]) {
    zone.addEventListener(type, (e) => { e.preventDefault(); if (enabled()) zone.classList.add("over"); });
  }
  for (const type of ["dragleave", "drop"]) zone.addEventListener(type, () => zone.classList.remove("over"));
  zone.addEventListener("drop", (e) => {
    e.preventDefault();
    if (!enabled()) return;
    const files = e.dataTransfer?.files;
    chooseFile(files && files.length ? files[0] : null);
    if (files && files.length > 1) $("file-info").textContent += " - only the first file is used";
  });
  $("up-rights").addEventListener("change", updateUploadButton);
  $("up-lang").addEventListener("change", updateUploadButton);
  $("up-btn").addEventListener("click", startUpload);
  $("up-cancel").addEventListener("click", () => { if (activeXhr) activeXhr.abort(); });
}

// ---------------------------------------------------------------- player
/**
 * seekTo(seconds): the ONLY place the page changes playback position programmatically.
 * Cited answers, graph navigation and highlight reels must call this instead of touching
 * video.currentTime. Clamps to [0, duration]; ignores invalid values; returns the position it
 * moved to, or null if it did nothing. Requires video metadata to be loaded (readyState >= 1);
 * until then it does nothing, so callers that may run early should wait for "loadedmetadata".
 */
let seekTo = () => null;

async function initPlayer(id) {
  show($("player"));
  const video = $("video");
  let lecture;
  try {
    lecture = await api(`/api/lectures/${encodeURIComponent(id)}`);
  } catch (e) {
    $("pl-error").textContent = e.message;
    show($("pl-error"));
    show(video, false);
    return;
  }
  document.title = `${lecture.title || "Lecture"} - Insightex`;
  show($("pl-existing"), params.get("existing") === "1");
  for (const w of lecture.warnings ?? []) {
    const note = document.createElement("div");
    note.className = "notice";
    note.setAttribute("role", "note");
    note.textContent = describeWarning(w);
    $("pl-warnings").append(note);
  }
  $("pl-title").textContent = lecture.title || lecture.lecture_id;
  const dur = formatTimestamp(lecture.duration_s);
  $("pl-duration").textContent = dur ? `Duration ${dur}` : "";
  $("pl-language").replaceChildren(languageLine(lecture.language));

  seekTo = (seconds) => {
    if (typeof seconds !== "number" || !Number.isFinite(seconds) || seconds < 0) return null;
    if (video.readyState < 1) return null;
    const max = Number.isFinite(video.duration) ? video.duration : seconds;
    const target = Math.min(seconds, max);
    video.currentTime = target;
    return target;
  };
  window.insightex = { seekTo };  // for later features and manual testing from the console

  const template = lecture.external_timestamp_url_template;
  const ytLink = $("yt-link");
  const updateYtLink = () => {
    ytLink.href = template.replace("{t}", String(Math.floor(video.currentTime || 0)));
  };
  if (template) {
    show($("yt-row"));
    for (const ev of ["loadedmetadata", "timeupdate", "seeked", "pause"]) video.addEventListener(ev, updateYtLink);
    for (const ev of ["click", "auxclick", "mouseover", "focus"]) ytLink.addEventListener(ev, updateYtLink);
    updateYtLink();
  }

  const jump = () => {
    const seconds = parseTimestamp($("jump").value);
    const err = $("jump-error");
    if (seconds === null) { err.textContent = "Use mm:ss, h:mm:ss or 1h2m3s."; return; }
    err.textContent = "";
    if (seekTo(seconds) === null) err.textContent = "The video isn't ready yet.";
  };
  $("jump-btn").addEventListener("click", jump);
  $("jump").addEventListener("keydown", (e) => { if (e.key === "Enter") jump(); });

  // Deep link ?t=...: seek once, as soon as metadata is available.
  const t = params.get("t");
  const applyDeepLink = () => { if (t !== null) { const s = parseTimestamp(t); if (s !== null) seekTo(s); } };
  video.addEventListener("loadedmetadata", applyDeepLink, { once: true });

  video.src = lecture.video_url;
  video.addEventListener("error", () => {
    $("pl-error").textContent = "The video couldn't be played.";
    show($("pl-error"));
  });
}
</script>
