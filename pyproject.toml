[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# No dependency list here: pinned dependencies live in requirements.lock.txt.
[project]
name = "insightex"
version = "0.0.0"
description = "Timestamp-grounded knowledge base for code-switched (Urdu + English) lecture videos"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.ruff]
line-length = 100
src = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
# Network tests hit real YouTube/Drive/HTTP servers: run them explicitly with `pytest -m network`.
markers = ["network: needs internet access and real URLs (skipped by default)"]
addopts = "-m 'not network'"
