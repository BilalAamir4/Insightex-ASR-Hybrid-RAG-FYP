[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Direct runtime dependencies, unpinned. Exact versions live in requirements.lock.txt (the source of truth).
[project]
name = "insightex"
version = "0.0.0"
description = "Timestamp-grounded knowledge base for code-switched (Urdu + English) lecture videos"
requires-python = ">=3.12"
dependencies = ["fastapi", "httpx", "pydantic>=2", "pymupdf", "PyYAML", "uvicorn", "yt-dlp"]

[project.optional-dependencies]
dev = ["ruff==0.16.10", "pytest-timeout==2.4.0"]  # pinned so lint and test runs are reproducible; also pinned in requirements.lock.txt

[project.scripts]
insightex = "insightex.cli:main"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
insightex = ["extract/*.json"]  # the M7 extraction JSON Schema (ADR-0048)

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tools/label_concepts/tests"]  # the M7 labelling tool's offline tests run with the suite
pythonpath = ["backend/src"]
# Network tests hit real YouTube/Drive/HTTP servers: run them explicitly with `pytest -m network`.
markers = [
    "network: needs internet access and real URLs (skipped by default)",
    "slow: spawns real worker processes and kills them; takes several seconds",
    "media: builds synthetic clips with ffmpeg and runs the real normalise engine (run alone: pytest -m media)",
    "real_env: opts out of the autouse settings isolation in backend/tests/conftest.py",
    "replay: replays recorded gate evidence through production code on the real Day 4 workspace (loads BGE-M3 on the CPU; run alone: pytest -m replay)",
    "gpu: runs real models on the GPU (needs CUDA, the offline model cache and free VRAM; run alone: pytest -m gpu)",
]
addopts = "-m 'not network and not gpu and not replay'"
# pytest-timeout: a hung test fails instead of stalling the suite. 120 s is about 5x the slowest offline test
# (24.9 s, test_kill_dash_9_during_normalisation_then_resume, 15 Oct 2026). gpu, replay and network tests get
# SLOW_MARKER_TIMEOUT_S from backend/tests/conftest.py. `--timeout 0` disables it for debugging.
timeout = 120
