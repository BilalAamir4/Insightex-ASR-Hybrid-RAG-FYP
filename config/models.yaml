  name: faster-whisper            # checkpoint not chosen
  runtime: CTranslate2
  device: cuda
  precision: float16
  used_by: [backend/src/insightex/asr]
  storage_path: ${INSIGHTEX_MODEL_CACHE_MASTER}/huggingface
  runtime_path: ${HF_HOME}
  venv: ~/envs/insightex
  peak_vram_mib: null
  status: pending
  decision_ref: null
  notes: >-
    Candidate checkpoints, both cached: Systran/faster-whisper-medium and Systran/faster-whisper-large-v3.
    Decision waits on WER evaluation.
    Verified peak VRAM: 5,530 MiB for large-v3 in the 10-minute run
    (old docs/reports/ENV_AUDIT_REPORT.md, removed 2026-10-07, in git history; data log followup/T2_process_a.txt).
