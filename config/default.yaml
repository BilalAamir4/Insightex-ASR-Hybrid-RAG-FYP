# Insightex default configuration: every setting and its default value.
# Override in config/local.yaml (gitignored) or the file named by $INSIGHTEX_CONFIG, then by
# INSIGHTEX__<SECTION>__<KEY> env vars. Library/process variables (HF_HOME, LD_LIBRARY_PATH, ...)
# stay in env/insightex_env.sh and are not settings. Show the merged result: insightex config show

paths:
  data_dir: ~/insightex-data        # runtime data root; workspaces/, logs/ and the job database live under it. Alias env: INSIGHTEX_DATA

api:
  host: 127.0.0.1                   # bind address; loopback only, the server refuses 0.0.0.0 and ::
  port: 8000                        # TCP port
  sse_poll_interval_s: 0.5          # seconds between database reads for each open job event stream
  sse_keepalive_s: 15               # seconds of silence before a ': keepalive' comment is sent on an event stream
  touch_min_interval_s: 60          # seconds; minimum gap between cache access-time updates for one workspace when serving media

ingest:
  ffprobe_timeout_s: 60             # seconds before ffprobe is killed
  max_url_length: 2048              # characters; longer URLs are rejected
  min_duration_s: 10                # seconds; shorter media is rejected (TOO_SHORT), links and files alike
  silence_warn_dbfs: -50            # dBFS; audio.wav with a lower mean volume gets the AUDIO_NEAR_SILENT warning
  disk_free_factor: 2.5             # multiple of the source size that must be free on the data filesystem
  disk_free_reserve_bytes: 1073741824  # bytes (1 GiB) added to the free-space requirement
  ffmpeg_timeout_factor: 3          # multiple of the media duration allowed for one ffmpeg run
  ffmpeg_timeout_min_s: 300         # seconds; lower bound of the ffmpeg run timeout
  verify:                           # checks on video.mp4 / audio.wav after normalising
    duration_tolerance_s: 2         # seconds; allowed |video.mp4 - source| duration difference (or duration_tolerance_frac, if larger)
    duration_tolerance_frac: 0.01   # fraction of the source duration; see duration_tolerance_s
    sync_tolerance_s: 0.1           # seconds; allowed stream start offset and audio-padding error in video.mp4
    av_mismatch_warn_s: 1.0         # seconds; |audio.wav - video.mp4| duration above this adds AV_DURATION_MISMATCH
  file:                             # local-file ingest only (ADR-0036)
    keep_original: false            # keep the uploaded original in the workspace after a successful normalise (links always keep theirs, ADR-0035)
    staging_dir: null               # copies being received; null = <paths.data_dir>/staging. Same filesystem as workspaces
    staging_max_age_h: 24           # hours; older staging files not used by a queued or running job are deleted at worker start
    copy_chunk_bytes: 8388608       # bytes (8 MiB) per read when copying and hashing a file
  url:
    max_duration_s: 10800           # seconds (3 h); checked at probe (when known) and after download
    max_download_bytes: 4294967296  # bytes (4 GiB); Content-Length and bytes actually received
    max_video_height: 1080          # pixels; taller video is scaled down, yt-dlp format capped to it
    deno_path: null                 # null = the deno wheel installed in the venv
    socket_timeout_s: 30            # seconds; yt-dlp socket timeout
    connect_timeout_s: 15           # seconds; direct-download connect and pool-wait timeout
    read_timeout_s: 60              # seconds; direct-download read and write timeout
  transcode:
    preset: veryfast                # libx264 preset
    crf: 23                         # libx264 constant rate factor (lower = better quality)
    max_height: 1080                # pixels; transcoded video taller than this is scaled down (copied video keeps its size)
    audio_bitrate_kbps: 160         # kbit/s; AAC bitrate when audio is transcoded
    keyframe_interval_s: 2          # seconds between forced keyframes in transcoded video
  thumbnail:
    max_width: 1280                 # pixels; frames wider than this are scaled down
    quality: 3                      # ffmpeg JPEG -q:v (2 best .. 31 worst)
    max_bytes: 10485760             # bytes (10 MiB); larger source thumbnails are not fetched

ollama:                             # M0 call contract, docs/adr/0002-ollama-call-contract.md
  base_url: http://localhost:11434  # Ollama server (loopback). Alias env: OLLAMA_BASE_URL
  model: qwen3.5:latest             # exact tag, checked against /api/tags before the first call
  think: false                      # request thinking text from the model
  num_ctx: 8192                     # tokens; project default context. chat_json takes it as a required argument
  num_predict: 1024                 # tokens; output cap, done_reason=length is an error
  keep_alive: 10m                   # how long the model stays loaded between calls
  temperature: 0                    # sampling temperature
  seed: 42                          # sampling seed
  request_timeout_s: 600            # seconds; /api/chat request timeout
  ps_timeout_s: 10                  # seconds; /api/ps request timeout
  unload_timeout_s: 60              # seconds; unload request timeout
  unload_wait_s: 30                 # seconds to poll /api/ps for the model to disappear after unload
  # `format` (JSON Schema) is generated per call from a pydantic class, so it is not a setting.

visual:
  enabled: false                    # optional visual pipeline (scene detection + OCR); nothing reads it yet

jobs:                               # job queue, worker and workspaces: docs/adr/0033-*.md, 0034-*.md
  db_path: null                     # SQLite file; null = <paths.data_dir>/insightex.db. Never under /mnt/
  workspaces_dir: null              # per-video workspaces; null = <paths.data_dir>/workspaces. Never under /mnt/
  run_dir: null                     # worker.lock and GPU lease lock files; null = <paths.data_dir>/run. Never under /mnt/
  poll_interval_s: 1.0              # seconds the worker sleeps when the queue is empty
  max_attempts: 3                   # claims of one job before crash recovery marks it failed
  progress_min_interval_s: 0.5      # seconds; minimum gap between progress writes of one stage
  busy_timeout_ms: 5000             # milliseconds SQLite waits on a locked database
  error_traceback_chars: 4000       # characters of traceback stored in a failed stage's error

gpu:                                # GPU lease: docs/adr/0033-*.md
  lease_enabled: true               # false = worker runs GPU stages without taking the lease
  lease_path: null                  # flock file; null = <jobs.run_dir>/gpu.lock. Never under /mnt/
  lock_retry_interval_s: 0.2        # seconds between non-blocking lock attempts
  ollama_poll_interval_s: 0.5       # seconds between /api/ps polls while waiting for the model to unload
  ollama_unload_timeout_s: 30       # seconds to wait for the model to leave /api/ps after an exclusive acquire
  qa_lease_timeout_s: 2.0           # seconds a Q&A call waits for a shared lease before answering "GPU busy"

sources:                            # source identity: docs/adr/0034-*.md
  hash_chunk_bytes: 1048576         # bytes (1 MiB) per read/write when hashing files

cache:                              # workspace cache: docs/adr/0034-*.md
  max_bytes: 42949672960            # bytes (40 GiB); least-recently-accessed unpinned workspaces are evicted above this
