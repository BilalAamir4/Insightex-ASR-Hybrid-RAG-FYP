# Insightex default configuration. Only keys with known values.
# ${VAR} entries are resolved from environment variables set by env/insightex_env.sh.
# Machine-specific overrides go in config/local.yaml (gitignored).
window_seconds: 30

visual:
  enabled: false

paths:
  home: ${INSIGHTEX_HOME}
  data: ${INSIGHTEX_DATA}
  model_cache_master: ${INSIGHTEX_MODEL_CACHE_MASTER}
  hf_home: ${HF_HOME}
  lectures: ${INSIGHTEX_DATA}/lectures

endpoints:
  ollama_base_url: ${OLLAMA_BASE_URL}

api:
  host: 127.0.0.1                   # loopback only; the server refuses 0.0.0.0 and ::
  port: 8000

ingest:
  url:
    max_duration_s: 10800             # 3 hours; checked at probe (when known) and after download
    max_download_bytes: 4294967296    # 4 GiB; Content-Length and bytes actually received
    keep_source: false                # delete the original download after a successful transcode
    max_video_height: 1080
    deno_path: null                   # null = the deno wheel installed in the venv
